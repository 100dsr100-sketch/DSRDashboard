<style>
  :root{
    --gold:#E8B200;
    --bg:#000000;
    --panel:#080808;
    --card:#000000;
    --ink:#ececec;
    --muted:#8b8b8b;
    --grid:#1b1b1b;
    --line:#242424;
    --up:#22c55e;
    --down:#ef4444;
    --blue:#5b9bd5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);}
  body{
    font-family:"Segoe UI",Roboto,Tahoma,Arial,sans-serif;
    color:var(--ink);-webkit-text-size-adjust:100%;
    padding:
      calc(env(safe-area-inset-top) + 8px)
      calc(env(safe-area-inset-right) + 8px)
      calc(env(safe-area-inset-bottom) + 8px)
      calc(env(safe-area-inset-left) + 8px);
  }
  .frame{
    max-width:480px;min-height:calc(100vh - 16px);margin:0 auto;
    background:var(--panel);border:2px solid var(--gold);border-radius:8px;
    display:flex;flex-direction:column;
  }
  .banner{
    position:relative;display:flex;align-items:center;gap:9px;
    padding:11px 12px 10px;border-bottom:2px solid var(--gold);
  }
  .banner .logo{width:30px;height:30px;flex:0 0 30px;}
  .banner h1{margin:0;font-size:17px;letter-spacing:.5px;flex:1;}
  .version{color:var(--gold);font-weight:700;font-size:10px;}
  .nav{display:flex;gap:0;border-bottom:2px solid var(--gold);}
  .nav button{
    flex:1;background:#000;border:none;border-right:1px solid var(--line);
    color:var(--muted);font-family:inherit;font-size:12.5px;font-weight:600;
    padding:9px 4px;cursor:pointer;letter-spacing:.3px;
  }
  .nav button:last-child{border-right:none;flex:0 0 46px;font-size:15px;}
  .nav button.active{color:var(--gold);background:#0c0b07;box-shadow:inset 0 -2px 0 var(--gold);}
  .statusbar{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:6px 12px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--grid);
  }
  .statusbar button{
    background:none;border:1px solid var(--line);color:var(--ink);
    border-radius:4px;padding:3px 9px;font-size:11px;cursor:pointer;font-family:inherit;
  }
  main{padding:10px 10px 4px;flex:1;}
  .screen{display:none;}
  .screen.active{display:block;}

  /* ---- market chart card ---- */
  .card{
    border:2px solid var(--gold);border-radius:6px;padding:9px 7px 7px;
    margin-bottom:11px;background:var(--card);
  }
  .card h2{margin:0 0 1px;font-size:13px;font-weight:700;padding:0 3px;}
  .card .sym{color:var(--muted);font-weight:600;font-size:11px;}
  .ranges{display:flex;justify-content:space-between;font-size:11.5px;padding:6px 2px 7px;}
  .ranges button{
    background:none;border:none;color:var(--muted);font:inherit;font-size:11.5px;
    padding:2px 3px;cursor:pointer;border-radius:4px;
  }
  .ranges button.active{color:var(--gold);font-weight:700;}
  .quote{padding:0 3px 3px;min-height:44px;}
  .quote .price{font-size:22px;font-weight:700;}
  .quote .chg{font-size:12.5px;margin-left:7px;}
  .quote .chg.up{color:var(--up);}
  .quote .chg.down{color:var(--down);}
  .quote .chgday{font-size:12.5px;margin-left:6px;color:var(--gold);}
  .quote .when{display:block;font-size:10.5px;color:var(--muted);margin-top:2px;}
  .chartwrap{width:100%;}
  .chartwrap svg{display:block;width:100%;height:auto;}
  .badge{font-size:9.5px;padding:1px 5px;border-radius:3px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:2px;}
  .badge.sample{color:var(--gold);border-color:var(--gold);}
  .badge.cached{color:var(--blue);border-color:var(--blue);}

  /* ---- portfolio ---- */
  .pcard{
    border:2px solid var(--gold);border-radius:6px;margin-bottom:11px;background:var(--card);
    padding:10px 11px;
  }
  .pcard h3{margin:0 0 8px;font-size:13.5px;color:var(--gold);letter-spacing:.4px;}
  .pline{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;border-bottom:1px dashed var(--line);}
  .pline:last-child{border-bottom:none;}
  .pline .lbl{color:var(--muted);}
  .pline .val{font-variant-numeric:tabular-nums;}
  .pline.total{font-weight:700;font-size:14px;padding-top:7px;border-bottom:none;}
  .pline.total .val{color:var(--up);}
  .pline.neg .val{color:var(--down);}
  .netcard{border-color:var(--gold);}
  .netcard .pline.total .val{color:var(--gold);font-size:16px;}
  details.holdings{margin-top:7px;}
  details.holdings summary{font-size:11.5px;color:var(--blue);cursor:pointer;}
  details.holdings .hrow{display:flex;justify-content:space-between;font-size:11.5px;padding:2px 0;color:var(--muted);}

  /* ---- settings ---- */

  .setgrp h3{margin:0 0 9px;font-size:13px;color:var(--gold);}

  .fld label{flex:1;font-size:12.5px;color:var(--muted);}
  .fld input{
    width:130px;font-size:13px;padding:6px 8px;background:#101010;color:var(--ink);
    border:1px solid var(--line);border-radius:4px;font-family:inherit;text-align:right;
  }
  .fld input.txt{text-align:left;flex:1;width:auto;}
  input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus,input:-webkit-autofill:active,
  input:autofill{
    -webkit-box-shadow:0 0 0 40px #101010 inset !important;box-shadow:0 0 0 40px #101010 inset !important;
    -webkit-text-fill-color:var(--ink) !important;caret-color:var(--ink);transition:background-color 9999s ease-out 0s;
  }
  .setgrp input.txt,#houseUrl,#relayUrl{background:#101010;color:var(--ink);}
  .mktrow{display:flex;gap:6px;margin-bottom:6px;}
  .mktrow input{font-size:12px;padding:5px 7px;background:#101010;color:var(--ink);border:1px solid var(--line);border-radius:4px;font-family:inherit;}
  .mktrow input.s{width:78px;text-transform:uppercase;}
  .mktrow input.n{flex:1;}
  .mktrow button{background:none;border:1px solid var(--line);color:var(--down);border-radius:4px;width:30px;cursor:pointer;font-size:14px;}
  .setgrp textarea{
    width:100%;min-height:70px;font-size:12px;padding:7px 8px;background:#101010;color:var(--ink);
    border:1px solid var(--line);border-radius:4px;font-family:inherit;resize:vertical;margin:4px 0;
  }
  .setgrp .hint{font-size:11px;color:var(--muted);display:block;margin:2px 0;}
  .setgrp .msg{font-size:11px;margin-top:4px;min-height:1.2em;}
  .setgrp .msg.ok{color:var(--up);} .setgrp .msg.err{color:var(--down);}
  .cryptogrid{max-height:280px;overflow-y:auto;border:1px solid var(--line);border-radius:4px;padding:6px;}
  .cryptogrid .fld{margin-bottom:5px;}
  .cryptogrid .fld label{font-size:11.5px;}
  .cryptogrid .fld input{width:150px;}
  .btnrow{display:flex;gap:8px;margin-top:6px;}
  .btnrow button{
    flex:1;font-family:inherit;font-size:13px;font-weight:600;padding:9px;border-radius:5px;cursor:pointer;
    background:var(--gold);color:#111;border:none;
  }
  .btnrow button.ghost{background:none;color:var(--ink);border:1px solid var(--line);}
  .addbtn{background:none;border:1px dashed var(--line);color:var(--gold);border-radius:4px;padding:7px;width:100%;cursor:pointer;font-family:inherit;font-size:12px;margin-top:2px;}
  footer{text-align:center;font-size:10px;color:var(--muted);padding:7px 0 10px;}

<script>
"use strict";
const $ = s => document.querySelector(s);
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

/* ================= config ================= */
// Yahoo's chart API blocks browser CORS, so requests are relayed. These free
// public relays are raced together (first success wins) but they are ALL
// unreliable - when they're down the app shows cached/sample data. The real
// fix is your own Cloudflare Worker: deploy it (see WORKER.md in the repo)
// and paste its URL into Settings > "Data relay". That entry is tried first
// and makes the feed rock solid - no code change or redeploy needed.
const PROXIES = [
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  u => 'https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent(u),
  u => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
  u => 'https://thingproxy.freeboard.io/fetch/' + u
];

const DEFAULT_MARKETS = [
  { symbol: '^IXIC',  name: 'Nasdaq Composite' },
  { symbol: 'NDQ.AX', name: 'BetaShares NASDAQ 100' },
  { symbol: 'IOO.AX', name: 'iShares Global 100' },
  { symbol: 'SOXX',   name: 'iShares Semiconductor' }
];

// [displayName, symbol, coingeckoId, defaultUnits] - seeded from
// C:\Lazarus Projects\Dashboard\UPortfolioData.pas
const CRYPTO_DEFS = [
  ['Bitcoin','BTC','bitcoin',0.50114423],
  ['Ethereum','ETH','ethereum',10.60728654],
  ['Solana','SOL','solana',39.16718479],
  ['TRON','TRX','tron',6106.03479617],
  ['BNB','BNB','binancecoin',2.92792531],
  ['XRP','XRP','ripple',491.00544098],
  ['ChainLink','LINK','chainlink',36.73899936],
  ['Dogecoin','DOGE','dogecoin',4841.27890756],
  ['Stellar Lumens','XLM','stellar',1192.41828914],
  ['Litecoin','LTC','litecoin',4.32527904],
  ['Shiba Inu','SHIB','shiba-inu',27877312.59],
  ['Uniswap','UNI','uniswap',30.97780701],
  ['Ravencoin','RVN','ravencoin',24955.32673404],
  ['Avalanche','AVAX','avalanche-2',10.29109362],
  ['Polygon Ecosystem Token','POL','matic-network',622.99951719],
  ['Cardano','ADA','cardano',226.66649606],
  ['Terra Classic','LUNC','terra-luna',777488.11264471],
  ['Algorand','ALGO','algorand',377.86386842],
  ['Polkadot','DOT','polkadot',35.46242902],
  ['Beam','BEAMX','beam-2',15915.38517],
  ['Santos FC Fan Token','SANTOS','santos-fc-fan-token',41.66328428],
  ['Decentraland','MANA','decentraland',117.29960252],
  ['Sonic','S','sonic-3',275.2187161],
  ['Internet Computer','ICP','internet-computer',3.00638768],
  ['Ethereum PoW','ETHW','ethereum-pow-iou',10.60110438],
  ['Terra','LUNA','terra-luna-2',27.12145239],
  ['USDC','USDC','usd-coin',0.28219505],
  ['Gravity','G','g-token',31.2210798],
  ['Manchester City Fan Token','CITY','manchester-city-fan-token',0.11118339],
  ['Sologenic','SOLO','solo-coin',2.2339009]
];

const DEFAULTS = {
  p1: { NDQ: 4077, IOO: 325 },
  p2: { NDQ: 1287, IOO: 51 },
  margin: 259654.79,
  superann: 575640.06,
  house: {
    url: 'https://www.realestate.com.au/property/6-reading-st-port-macquarie-nsw-2444/',
    price: '$878,025',
    isDefault: true
  }
};

// interval -> Yahoo params, from UMiniStockChart.MiniIntervalYahooParams
const RANGES = ['1D','5D','1M','6M','YTD','1Y','5Y','Max'];
const RANGE_MAP = {
  '1D' : { i:'1m',  r:'5d',  days:1 },
  '5D' : { i:'5m',  r:'1mo', days:5 },
  '1M' : { i:'30m', r:'1mo', days:0 },
  '6M' : { i:'1h',  r:'6mo', days:0 },
  'YTD': { i:'1h',  r:'ytd', days:0 },
  '1Y' : { i:'1h',  r:'1y',  days:0 },
  '5Y' : { i:'1d',  r:'5y',  days:0 },
  'Max': { i:'1wk', r:'max', days:0 }
};

/* ================= state ================= */
const state = {
  markets:  LS.get('dsr-dash-markets', DEFAULT_MARKETS),
  p1:       LS.get('dsr-dash-p1', DEFAULTS.p1),
  p2:       LS.get('dsr-dash-p2', DEFAULTS.p2),
  margin:   LS.get('dsr-dash-margin', DEFAULTS.margin),
  superann: LS.get('dsr-dash-super', DEFAULTS.superann),
  house:    LS.get('dsr-dash-house', { ...DEFAULTS.house }),
  relay:    LS.get('dsr-dash-relay', 'https://dsr-yahoo.100dsr100.workers.dev'),
  crypto:   LS.get('dsr-dash-crypto', Object.fromEntries(CRYPTO_DEFS.map(c => [c[1], c[3]])))
};
function saveState(){
  LS.set('dsr-dash-markets', state.markets);
  LS.set('dsr-dash-p1', state.p1);
  LS.set('dsr-dash-p2', state.p2);
  LS.set('dsr-dash-margin', state.margin);
  LS.set('dsr-dash-super', state.superann);
  LS.set('dsr-dash-house', state.house);
  LS.set('dsr-dash-relay', state.relay);
  LS.set('dsr-dash-crypto', state.crypto);
}

/* ================= data layer ================= */
const fxCache = {};        // 'USD' -> AUD per 1 USD
const chartCache = {};      // in-memory, session

function relayWrap(u){
  const b = (state.relay || '').trim();
  if (!b) return null;
  return b.replace(/\/+$/, '') + '/?url=' + encodeURIComponent(u);
}
async function proxiedText(url, timeoutMs = 7000){
  const attempt = wrap => {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), timeoutMs);
    return fetch(wrap(url), { signal: ctrl.signal })
      .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.text(); })
      .finally(() => clearTimeout(t));
  };
  const wraps = PROXIES.slice();
  if (relayWrap(url)) wraps.unshift(relayWrap);       // your own relay is tried alongside, and wins if healthy
  return Promise.any(wraps.map(attempt));             // first to succeed wins
}
async function proxiedJSON(url, timeoutMs = 7000){
  return JSON.parse(await proxiedText(url, timeoutMs));
}

// -> { currency, price, prevClose, points:[{t,c}] }
async function fetchYahooChart(symbol, range){
  const m = RANGE_MAP[range];
  const url = 'https://query1.finance.yahoo.com/v8/finance/chart/' +
    encodeURIComponent(symbol) + '?interval=' + m.i + '&range=' + m.r + '&events=div&includePrePost=false';
  const js = await proxiedJSON(url);
  const r = js && js.chart && js.chart.result && js.chart.result[0];
  if (!r) throw new Error((js && js.chart && js.chart.error && js.chart.error.description) || 'no data');
  const meta = r.meta || {};
  const ts = r.timestamp || [];
  const q = r.indicators && r.indicators.quote && r.indicators.quote[0] || {};
  const closes = q.close || [];
  let points = [];
  for (let i = 0; i < ts.length; i++){
    const c = closes[i];
    if (c != null && isFinite(c)) points.push({ t: ts[i], c: c });
  }
  if (m.days){
    // keep only the last N distinct local dates present (mirrors
    // UMiniStockChart.FilterLastNTradingDays)
    const dayKey = t => { const d = new Date(t * 1000); return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); };
    const seen = [];
    for (let i = points.length - 1; i >= 0; i--){
      const k = dayKey(points[i].t);
      if (!seen.includes(k)){ seen.push(k); if (seen.length > m.days) { points = points.slice(i + 1); break; } }
    }
  }
  return {
    currency: (meta.currency || '').toUpperCase(),
    exchangeTz: meta.exchangeTimezoneName || '',   // e.g. "America/New_York" - so the day label uses exchange time
    price: meta.regularMarketPrice,
    prevClose: meta.chartPreviousClose,
    points
  };
}

async function fxToAUD(cur){
  cur = (cur || '').toUpperCase();
  if (!cur || cur === 'AUD') return 1;
  if (fxCache[cur] != null) return fxCache[cur];
  try{
    const c = await fetchYahooChart('AUD' + cur + '=X', '1D');   // e.g. AUDUSD=X = USD per 1 AUD
    const p = c.price || (c.points.length && c.points[c.points.length - 1].c);
    if (p > 0){ fxCache[cur] = 1 / p; return fxCache[cur]; }
  }catch(e){}
  fxCache[cur] = null;
  return null;
}

// full chart, converted to AUD; falls back to cache then synthetic
async function getChartAUD(symbol, range){
  const key = symbol + '|' + range;
  try{
    const c = await fetchYahooChart(symbol, range);
    let rate = 1, conv = false;
    if (c.currency && c.currency !== 'AUD' && !/=X$/i.test(symbol)){
      const r = await fxToAUD(c.currency);
      if (r){ rate = r; conv = true; }
    }
    const out = {
      points: c.points.map(p => ({ t: p.t, c: p.c * rate })),
      price: (c.price || (c.points.length && c.points[c.points.length - 1].c) || 0) * rate,
      prevClose: (c.prevClose || 0) * rate,
      exchangeTz: c.exchangeTz || '',
      src: 'live', currency: conv ? c.currency + '\u2192AUD' : (c.currency || 'AUD')
    };
    if (!out.prevClose && out.points.length) out.prevClose = out.points[0].c;
    chartCache[key] = { ...out, at: Date.now() };
    LS.set('dsr-dash-cache-' + key, chartCache[key]);
    return out;
  }catch(e){
    const cached = chartCache[key] || LS.get('dsr-dash-cache-' + key, null);
    if (cached && cached.points && cached.points.length)
      return { ...cached, src: 'cached' };
    return { ...sampleSeries(symbol, range), src: 'sample' };
  }
}

async function fetchCryptoAUD(ids){
  const url = 'https://api.coingecko.com/api/v3/simple/price?ids=' + ids.join(',') + '&vs_currencies=aud';
  const js = await fetch(url).then(r => r.json());
  const out = {};
  ids.forEach(id => { out[id] = (js && js[id] && js[id].aud) || 0; });
  return out;
}

/* ---- house price (realestate.com.au estimate) ----
   Ported from C:\Lazarus Projects\Dashboard\UHouseScraper.pas. The desktop
   app renders the page in a real embedded browser then reads innerText;
   from a static PWA the best we can do is a proxied raw-HTML fetch, which
   realestate.com.au's bot protection usually blocks - so this fails soft
   and the Settings "paste page text" box is the reliable path. */
function extractDollarAmount(text){
  const m = /\$[\d,]+/.exec(text || '');
  if (!m) return '';
  return m[0].replace(/,+$/, '');
}
function scrapePriceFromText(text){
  const lt = (text || '').toLowerCase();
  let markers = ['based on data we have available', 'the estimated property value of',
                 'estimated value', 'property value estimate'];
  let p = -1, used = '';
  for (const mk of markers){ p = lt.indexOf(mk); if (p >= 0){ used = mk; break; } }
  if (p < 0){
    const d = extractDollarAmount(text);
    return d ? { sentence: 'Estimated value ' + d, amount: d } : { sentence: '', amount: '' };
  }
  let end = p + used.length;
  while (end < text.length && end - p < 400){
    if (text[end] === '.' && text[end - 1] >= '0' && text[end - 1] <= '9'){ end++; break; }
    end++;
  }
  const sentence = text.slice(p, end).trim();
  return { sentence, amount: extractDollarAmount(sentence) };
}
async function fetchHousePrice(url){
  const html = await proxiedText(url, 9000);
  const txt = html.replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ');
  const r = scrapePriceFromText(txt);
  if (!r.amount) throw new Error('no price found in page (likely a bot-check page) - use paste box');
  return r;
}

/* ---- synthetic fallback (seeded per symbol+range) ---- */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
const SAMPLE_BASE = { '^IXIC': 26800, 'NDQ.AX': 59.41, 'IOO.AX': 165.2, 'SOXX': 385 };
function sampleSeries(symbol, range){
  const cfg = { '1D':[78,.0016], '5D':[120,.004], '1M':[130,.006], '6M':[150,.009],
                'YTD':[160,.010], '1Y':[170,.011], '5Y':[200,.015], 'Max':[220,.017] }[range] || [78,.0016];
  const rnd = mulberry32(hashStr(symbol + '|' + range));
  const base = SAMPLE_BASE[symbol] || 100;
  const now = Math.floor(Date.now() / 1000);
  const stepSec = { '1D':300,'5D':1800,'1M':3600,'6M':21600,'YTD':43200,'1Y':43200,'5Y':604800,'Max':1209600 }[range] || 3600;
  let p = base; const points = [];
  for (let i = 0; i < cfg[0]; i++){
    p = p * (1 + 0.0003 + (rnd() - 0.5) * cfg[1] * 2);
    points.push({ t: now - (cfg[0] - i) * stepSec, c: p });
  }
  return { points, price: points[points.length - 1].c, prevClose: base, currency: 'AUD (sample)' };
}

/* ================= formatting ================= */
const AUD0 = new Intl.NumberFormat('en-AU', { style:'currency', currency:'AUD', maximumFractionDigits:0 });
const AUD2 = new Intl.NumberFormat('en-AU', { style:'currency', currency:'AUD', maximumFractionDigits:2 });
const NUM  = new Intl.NumberFormat('en-AU', { maximumFractionDigits:2 });
function money(v){ return Math.abs(v) >= 1000 ? AUD0.format(v) : AUD2.format(v); }
function priceStr(v){ const dp = v < 20 ? 3 : (v < 2000 ? 2 : 0); return '$' + v.toLocaleString('en-AU',{minimumFractionDigits:dp,maximumFractionDigits:dp}); }

// "Today" / "Yesterday" / "Last Friday" / "3 Aug" for the date of a quote,
// judged in the EXCHANGE's timezone (so a US close that lands after midnight
// AEST still reads "Last Friday", not "Last Saturday"). Falls back to the
// device's local timezone when tz is unknown.
function ymdInTZ(date, tz){
  try{
    return new Intl.DateTimeFormat('en-CA',
      { timeZone: tz || undefined, year: 'numeric', month: '2-digit', day: '2-digit' }).format(date);
  }catch(e){
    return new Intl.DateTimeFormat('en-CA', { year: 'numeric', month: '2-digit', day: '2-digit' }).format(date);
  }
}
function relativeDay(ts, tz){
  if (!ts) return '';
  const d = new Date(ts * 1000);
  const dY = ymdInTZ(d, tz), nY = ymdInTZ(new Date(), tz);
  const days = Math.round((Date.parse(nY + 'T00:00:00Z') - Date.parse(dY + 'T00:00:00Z')) / 86400000);
  if (days <= 0) return 'Today';
  if (days === 1) return 'Yesterday';
  const opt = tz ? { timeZone: tz } : {};
  if (days <= 6) return 'Last ' + d.toLocaleDateString('en-AU', { ...opt, weekday: 'long' });
  return d.toLocaleDateString('en-AU', { ...opt, day: 'numeric', month: 'short' });
}

function axisLabels(points, range){
  if (!points.length) return [];
  const n = points.length, idx = [0, Math.floor(n/4), Math.floor(n/2), Math.floor(3*n/4), n-1];
  const uniq = [...new Set(idx)];
  return uniq.map(i => {
    const d = new Date(points[i].t * 1000);
    let txt;
    if (range === '1D' || range === '5D')
      txt = d.toLocaleTimeString('en-AU', { hour:'numeric', minute:'2-digit' });
    else if (range === '1M' || range === '6M' || range === 'YTD' || range === '1Y')
      txt = d.toLocaleDateString('en-AU', { day:'numeric', month:'short' });
    else txt = String(d.getFullYear());
    return { pos: i / (n - 1), txt };
  });
}

/* ================= chart renderer ================= */
function chartSVG(data, range, symbol){
  const pts = data.points;
  if (!pts.length) return '<svg viewBox="0 0 440 210"></svg>';
  const W = 440, H = 210, padL = 52, padR = 12, padT = 8, padB = 20;
  const vals = pts.map(p => p.c);
  const pc = data.prevClose || vals[0];
  const lo = Math.min(pc, ...vals), hi = Math.max(pc, ...vals), span = (hi - lo) || 1;
  const X = i => padL + (i / (pts.length - 1)) * (W - padL - padR);
  const Y = v => padT + (1 - (v - lo) / span) * (H - padT - padB);
  const last = vals[vals.length - 1], chg = last - pc, up = chg >= 0;
  const col = up ? '#22c55e' : '#ef4444';

  let g = '';
  for (let s = 0; s <= 4; s++){
    const v = lo + span * s / 4, y = Y(v).toFixed(1);
    g += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#1b1b1b"/>`;
    g += `<text x="${padL-6}" y="${(+y+3).toFixed(1)}" text-anchor="end" font-size="9" fill="#8b8b8b">${priceStr(v)}</text>`;
  }
  axisLabels(pts, range).forEach(l => {
    const x = padL + l.pos * (W - padL - padR);
    const a = l.pos < 0.02 ? 'start' : (l.pos > 0.98 ? 'end' : 'middle');
    g += `<text x="${x.toFixed(1)}" y="${H-6}" text-anchor="${a}" font-size="9" fill="#8b8b8b">${l.txt}</text>`;
  });
  const pcY = Y(pc).toFixed(1);
  g += `<line x1="${padL}" y1="${pcY}" x2="${W-padR}" y2="${pcY}" stroke="#8b8b8b" stroke-dasharray="3 3" opacity="0.7"/>`;
  g += `<text x="${W-padR}" y="${(+pcY-4).toFixed(1)}" text-anchor="end" font-size="9" fill="#8b8b8b">Prev close ${priceStr(pc)}</text>`;

  const line = pts.map((p,i) => (i?'L':'M') + X(i).toFixed(1) + ' ' + Y(p.c).toFixed(1)).join(' ');
  const area = line + ` L ${X(pts.length-1).toFixed(1)} ${H-padB} L ${X(0).toFixed(1)} ${H-padB} Z`;
  const gid = 'grad' + hashStr(symbol + range).toString(36);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity="0.22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/>
    </linearGradient></defs>
    ${g}
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round"/>
    <circle cx="${X(pts.length-1).toFixed(1)}" cy="${Y(last).toFixed(1)}" r="2.6" fill="${col}"/>
    <text x="${W-padR}" y="${H-padB-8}" text-anchor="end" font-size="19" font-weight="700" fill="#E8B200" opacity="0.9" letter-spacing="1">${symbol}</text>
  </svg>`;
}

async function loadCard(card){
  const symbol = card.dataset.symbol, range = card.dataset.range;
  const qEl = card.querySelector('.quote'), cEl = card.querySelector('.chartwrap');
  qEl.innerHTML = '<span class="when">Loading&hellip;</span>';
  const data = await getChartAUD(symbol, range);
  const last = data.price, pc = data.prevClose || (data.points[0] && data.points[0].c) || last;
  const chg = last - pc, pct = pc ? chg / pc * 100 : 0, up = chg >= 0;
  const dp = last < 20 ? 3 : (last < 2000 ? 2 : 2);
  const badge = data.src === 'sample' ? '<span class="badge sample">SAMPLE</span>'
              : data.src === 'cached' ? `<span class="badge cached">cached ${new Date(data.at||Date.now()).toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'})}</span>`
              : '';
  if (data.src !== 'live')
    setStatus('⚠ Live feed unavailable — showing ' + (data.src === 'cached' ? 'last saved' : 'sample') +
              ' data.' + (state.relay ? '' : ' Add a data relay in Settings.'));
  const dayLbl = relativeDay(data.points.length ? data.points[data.points.length - 1].t : 0, data.exchangeTz);
  qEl.innerHTML =
    `<span class="price">${priceStr(last)}</span>` +
    `<span class="chg ${up?'up':'down'}">${up?'+':''}${pct.toFixed(2)}% (${up?'+':''}${chg.toFixed(dp)})</span>` +
    (dayLbl ? `<span class="chgday">${dayLbl}</span>` : '') + badge +
    `<span class="when">${range} &bull; ${data.currency || 'AUD'}</span>`;
  cEl.innerHTML = chartSVG(data, range, symbol);
}

  });
  addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js')
      .then(reg => { reg.update(); setInterval(() => reg.update(), 60 * 60 * 1000); })
      .catch(() => {});
  });
}

show('markets');
</script>
